<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00897b">
  <meta name="description" content="無駄遣いと回避できた支出を、端末内だけで手軽に記録するPWAです。">
  <title>無駄遣い・回避記録</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.ico">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">SPENDING TRACKER</p>
      <h1>無駄遣い・回避記録</h1>
      <p class="description">使ってしまった額と、使わずに済んだ額をワンタップで残します。</p>
    </header>

    <section class="summary-card" aria-labelledby="summary-title">
      <div class="summary-heading">
        <div>
          <h2 id="summary-title">今月の差引効果</h2>
          <p id="monthRange" class="summary-period"></p>
        </div>
        <p class="balance-value"><span id="monthNet">0</span><span class="unit">円</span></p>
        <div class="split-totals" aria-label="今月の内訳">
          <p><span class="split-label expense-text">無駄遣い</span><strong id="monthExpense">0円</strong></p>
          <p><span class="split-label saving-text">回避</span><strong id="monthSaving">0円</strong></p>
        </div>
      </div>

      <dl class="summary-grid">
        <div class="summary-item">
          <dt>今日</dt>
          <dd><span id="dayNet">0</span> 円</dd>
          <span id="dayRange" class="range-label"></span>
        </div>
        <div class="summary-item">
          <dt>今週</dt>
          <dd><span id="weekNet">0</span> 円</dd>
          <span id="weekRange" class="range-label"></span>
        </div>
        <div class="summary-item">
          <dt>今年</dt>
          <dd><span id="yearNet">0</span> 円</dd>
          <span id="yearRange" class="range-label"></span>
        </div>
        <div class="summary-item">
          <dt>累計</dt>
          <dd><span id="allNet">0</span> 円</dd>
          <span class="range-label">全記録</span>
        </div>
      </dl>
    </section>

    <section class="entry-card" aria-labelledby="entry-title">
      <div class="section-heading">
        <h2 id="entry-title">記録する</h2>
        <p>左が無駄遣い、右が回避できた支出です。</p>
      </div>

      <div id="amountButtons" class="button-grid">
        <button class="amount-button expense" type="button" data-amount="-150">−150円</button>
        <button class="amount-button saving" type="button" data-amount="150">＋150円</button>
        <button class="amount-button expense" type="button" data-amount="-300">−300円</button>
        <button class="amount-button saving" type="button" data-amount="300">＋300円</button>
        <button class="amount-button expense" type="button" data-amount="-1000">−1,000円</button>
        <button class="amount-button saving" type="button" data-amount="1000">＋1,000円</button>
        <button class="amount-button expense" type="button" data-amount="-4000">−4,000円</button>
        <button class="amount-button saving" type="button" data-amount="4000">＋4,000円</button>
      </div>

      <button id="customToggle" class="custom-toggle" type="button" aria-expanded="false" aria-controls="customEntry">その他の金額</button>
      <form id="customEntry" class="custom-entry" hidden>
        <label for="customAmount">金額</label>
        <div class="amount-input-wrap">
          <input id="customAmount" name="amount" type="number" min="1" max="100000000" step="1" inputmode="numeric" autocomplete="off" placeholder="例: 750" required>
          <span>円</span>
        </div>
        <label for="customNote">メモ <span class="optional">任意</span></label>
        <input id="customNote" name="note" type="text" maxlength="200" autocomplete="off" placeholder="例: コンビニに寄らなかった">
        <div class="custom-actions">
          <button class="custom-submit expense" type="submit" data-kind="expense">無駄遣いとして記録</button>
          <button class="custom-submit saving" type="submit" data-kind="saving">回避として記録</button>
        </div>
      </form>
    </section>

    <section id="lastAction" class="last-action" aria-live="polite" hidden>
      <p id="lastActionMessage"></p>
      <div class="last-action-buttons">
        <button id="addNoteButton" type="button">メモを追加</button>
        <button id="undoButton" type="button">取り消す</button>
      </div>
    </section>

    <section class="records-card" aria-labelledby="records-title">
      <div class="section-heading section-heading-row">
        <div>
          <h2 id="records-title">最近の記録</h2>
          <p>直近10件。メモの編集や誤入力の削除ができます。</p>
        </div>
      </div>
      <p id="emptyRecords" class="empty-state">まだ記録がありません。</p>
      <ol id="recentRecords" class="record-list"></ol>
    </section>

    <section class="trend-card" aria-labelledby="trend-title">
      <div class="section-heading">
        <h2 id="trend-title">月ごとの差引</h2>
        <p>直近6か月の差引効果です。</p>
      </div>
      <div id="monthlyTrend" class="trend-list"></div>
    </section>

    <details class="data-card">
      <summary>データ管理</summary>
      <div class="data-content">
        <p>記録はこの端末のブラウザ内だけに保存されます。</p>
        <div class="data-actions">
          <button id="exportJsonButton" type="button">JSONバックアップ</button>
          <button id="exportCsvButton" type="button">CSVを書き出す</button>
          <button id="importButton" type="button">バックアップを復元</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
          <button id="resetButton" class="danger-button" type="button">すべての記録を削除</button>
        </div>
      </div>
    </details>

    <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
