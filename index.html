<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00897b">
  <meta name="description" content="無駄遣いと回避できた支出を、端末内だけで手軽に記録するPWAです。">
  <title>無駄遣い・回避記録</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.ico">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">SPENDING TRACKER</p>
      <h1>無駄遣い・回避記録</h1>
      <p class="description">使ってしまった額はマイナス、回避できた額はプラスで記録します。</p>
    </header>

    <section class="summary-card" aria-labelledby="summary-title">
      <div class="summary-heading">
        <h2 id="summary-title">集計</h2>
        <p class="balance-label">累計残高</p>
        <p class="balance-value"><span id="balance">0</span><span class="unit">円</span></p>
      </div>

      <dl class="summary-grid">
        <div class="summary-item">
          <dt>今日</dt>
          <dd><span id="dayTotal">0</span> 円</dd>
          <span id="dayRange" class="range-label"></span>
        </div>
        <div class="summary-item">
          <dt>今週</dt>
          <dd><span id="weekTotal">0</span> 円</dd>
          <span id="weekRange" class="range-label"></span>
        </div>
        <div class="summary-item">
          <dt>今月</dt>
          <dd><span id="monthTotal">0</span> 円</dd>
          <span id="monthRange" class="range-label"></span>
        </div>
        <div class="summary-item">
          <dt>今年</dt>
          <dd><span id="yearTotal">0</span> 円</dd>
          <span id="yearRange" class="range-label"></span>
        </div>
      </dl>
    </section>

    <section class="entry-card" aria-labelledby="entry-title">
      <div class="section-heading">
        <h2 id="entry-title">記録する</h2>
        <p>左が無駄遣い、右が回避できた支出です。</p>
      </div>

      <div id="amountButtons" class="button-grid">
        <button class="amount-button expense" type="button" data-amount="-150">−150円</button>
        <button class="amount-button saving" type="button" data-amount="150">＋150円</button>
        <button class="amount-button expense" type="button" data-amount="-300">−300円</button>
        <button class="amount-button saving" type="button" data-amount="300">＋300円</button>
        <button class="amount-button expense" type="button" data-amount="-1000">−1,000円</button>
        <button class="amount-button saving" type="button" data-amount="1000">＋1,000円</button>
        <button class="amount-button expense" type="button" data-amount="-4000">−4,000円</button>
        <button class="amount-button saving" type="button" data-amount="4000">＋4,000円</button>
      </div>
    </section>

    <section class="maintenance" aria-label="データ管理">
      <button id="resetButton" class="reset-button" type="button">すべての記録を削除</button>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
